[package]
name = "pcm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Логика ProtoCore-MCS-Manager: серверы, моды, плагины, бэкапы"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }
rand = "0.8"
thiserror = "2"
log = "0.4"
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
sha1_smol = { version = "1", features = ["std"] }
sha2 = "0.10"
flate2 = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Media_Audio"] }

[dev-dependencies]
tempfile = "3"
