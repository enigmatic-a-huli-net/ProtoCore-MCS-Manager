# Сборка .exe для Windows на каждый push и Release по тегу v*
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Тесты ядра
        run: cargo test -p pcm-core
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Проверка интерфейса
        run: npm run check

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Сборка
        run: npx tauri build
      - name: Портативная версия (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/ProtoCore-MCS-Manager | Out-Null
          Copy-Item target/release/ProtoCore-MCS-Manager.exe out/ProtoCore-MCS-Manager/
          New-Item -ItemType Directory -Force out/ProtoCore-MCS-Manager/branding | Out-Null
          Copy-Item branding/README.txt out/ProtoCore-MCS-Manager/branding/
          Compress-Archive -Path out/ProtoCore-MCS-Manager -DestinationPath out/ProtoCore-MCS-Manager-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoCore-MCS-Manager-windows
          path: |
            out/ProtoCore-MCS-Manager-portable.zip
            target/release/bundle/nsis/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG-latest.md
          files: |
            out/ProtoCore-MCS-Manager-portable.zip
            target/release/bundle/nsis/*.exe
