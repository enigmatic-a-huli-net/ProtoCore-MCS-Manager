# Сборка .exe для Windows на каждый push.
# Релиз создаётся сам, когда в main приходит новая версия (поле version в src-tauri/tauri.conf.json):
# поменял версию, дописал CHANGELOG-latest.md, запушил — менеджеры у всех увидят обновление.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Тесты ядра
        run: cargo test -p pcm-core
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Проверка интерфейса
        run: npm run check

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Сборка
        run: npx tauri build
      - name: Портативная версия (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/ProtoCore-MCS-Manager | Out-Null
          Copy-Item target/release/ProtoCore-MCS-Manager.exe out/ProtoCore-MCS-Manager/
          New-Item -ItemType Directory -Force out/ProtoCore-MCS-Manager/branding | Out-Null
          Copy-Item branding/README.txt out/ProtoCore-MCS-Manager/branding/
          Compress-Archive -Path out/ProtoCore-MCS-Manager -DestinationPath out/ProtoCore-MCS-Manager-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoCore-MCS-Manager-windows
          path: |
            out/ProtoCore-MCS-Manager-portable.zip
            target/release/bundle/nsis/*.exe
      - name: Нужен ли релиз
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) { "new=true" >> $env:GITHUB_OUTPUT } else { "new=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ProtoCore-MCS-Manager ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG-latest.md
          files: |
            out/ProtoCore-MCS-Manager-portable.zip
            target/release/bundle/nsis/*.exe
